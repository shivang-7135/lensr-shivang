name: Azure Deploy

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install frontend dependencies
        run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Type check frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: NITRO_PRESET=node-server npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-key-for-build"

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install backend dependencies
        run: |
          pip install -e .
          pip install "ruff==0.14.3" mypy pytest httpx pytest-asyncio
        working-directory: backend
      - name: Lint backend (ruff)
        run: ruff check app/
        working-directory: backend
      - name: Format check backend (ruff)
        run: ruff format --check app/
        working-directory: backend
      - name: Type check backend (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        working-directory: backend
        continue-on-error: true

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/lensr-backend:latest ./backend
          docker push ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/lensr-backend:latest
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Update Backend Container App
        run: |
          az containerapp update -n lensrprod-backend -g lensr-sweden-prod --image ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/lensr-frontend:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/lensr-frontend:latest .
          docker push ghcr.io/${{ github.repository_owner }}/lensr-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/lensr-frontend:latest
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Update Frontend Container App
        run: |
          az containerapp update -n lensrprod-frontend -g lensr-sweden-prod --image ghcr.io/${{ github.repository_owner }}/lensr-frontend:${{ github.sha }}
