name: Azure Deploy

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install frontend dependencies
        run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Type check frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: NITRO_PRESET=node-server npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install backend dependencies
        run: |
          pip install -e .
          pip install "ruff==0.14.3" mypy pytest httpx pytest-asyncio
        working-directory: backend
      - name: Lint backend (ruff)
        run: ruff check app/
        working-directory: backend
      - name: Format check backend (ruff)
        run: ruff format --check app/
        working-directory: backend
      - name: Type check backend (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        working-directory: backend
        continue-on-error: true

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/lensr-backend:latest ./backend
          docker push ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/lensr-backend:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: "1954ed13-072c-4575-a8be-07ca3421a828"
          tenant-id: "c4e594dd-ae46-4889-a450-6c7eaaff06e2"
          subscription-id: "ebdb8870-091f-4513-83cc-db0de41882dc"

      - name: Update Backend Container App
        run: |
          SUFFIX="${{ github.sha }}"
          az containerapp update \
            --name lensrprod-backend \
            --resource-group lensr-sweden-prod \
            --image ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }} \
            --revision-suffix "${SUFFIX:0:8}" \
            --min-replicas 1 \
            --max-replicas 3

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/lensr-frontend:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/lensr-frontend:latest .
          docker push ghcr.io/${{ github.repository_owner }}/lensr-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/lensr-frontend:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: "1954ed13-072c-4575-a8be-07ca3421a828"
          tenant-id: "c4e594dd-ae46-4889-a450-6c7eaaff06e2"
          subscription-id: "ebdb8870-091f-4513-83cc-db0de41882dc"

      - name: Update Frontend Container App
        run: |
          SUFFIX="${{ github.sha }}"
          az containerapp update \
            --name lensrprod-frontend \
            --resource-group lensr-sweden-prod \
            --image ghcr.io/${{ github.repository_owner }}/lensr-frontend:${{ github.sha }} \
            --revision-suffix "${SUFFIX:0:8}" \
            --min-replicas 1 \
            --max-replicas 3
