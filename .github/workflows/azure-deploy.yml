name: Azure Deploy

on:
  push:
    branches:
      - production

# Set minimum required permissions
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      # --- Frontend Steps ---
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Install frontend dependencies
        run: npm install
        
      - name: Lint frontend
        run: npm run lint
        
      - name: Type check frontend
        run: npx tsc --noEmit
        
      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-key-for-build"

      # --- Backend Steps ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          
      - name: Install backend dependencies
        run: |
          pip install -e .
          pip install "ruff==0.14.3" mypy pytest httpx pytest-asyncio
        working-directory: backend
        
      - name: Lint backend (ruff)
        run: ruff check app/
        working-directory: backend
        
      - name: Format check backend (ruff)
        run: ruff format --check app/
        working-directory: backend
        
      - name: Type check backend (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional
        working-directory: backend
        continue-on-error: true

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and tag Docker image
        # Build image with git SHA tag and latest tag
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/lensr-backend:latest ./backend
          
      - name: Push Docker image
        # Push both tags to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/lensr-backend:latest
          
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Update Container App
        # Update the container app with the newly pushed image
        run: |
          az containerapp update \
            --name lensr-backend \
            --resource-group lensr-rg \
            --image ghcr.io/${{ github.repository_owner }}/lensr-backend:${{ github.sha }}
            
      - name: Verify health
        # Retrieve the FQDN dynamically and check the healthz endpoint
        run: |
          FQDN=$(az containerapp show -n lensr-backend -g lensr-rg --query properties.configuration.ingress.fqdn -o tsv)
          curl -sf https://$FQDN/healthz
          
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build frontend
        # Build using environment variables from secrets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          output_location: dist
